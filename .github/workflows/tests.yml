name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[waveforms]"
      - run: python scripts/test.py --output runs/ci-tests.json
      - run: python -m pip wheel --no-deps --wheel-dir dist .
